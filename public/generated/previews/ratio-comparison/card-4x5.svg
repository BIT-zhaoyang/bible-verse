  <text x="114" y="288" fill="#ffffff" font-size="72" font-family="Georgia, serif">The Lord is my</text><text x="114" y="380" fill="#ffffff" font-size="72" font-family="Georgia, serif">shepherd; I shall not</text><text x="114" y="472" fill="#ffffff" font-size="72" font-family="Georgia, serif">want.</text>
  <text x="114" y="640" fill="rgba(255,255,255,0.9)" font-size="30" font-family="Arial, sans-serif">A calm reminder that God</text><text x="114" y="684" fill="rgba(255,255,255,0.9)" font-size="30" font-family="Arial, sans-serif">provides what is needed,</text><text x="114" y="728" fill="rgba(255,255,255,0.9)" font-size="30" font-family="Arial, sans-serif">even when the path ahead</text><text x="114" y="772" fill="rgba(255,255,255,0.9)" font-size="30" font-family="Arial, sans-serif">feels uncertain.</text>
  <text x="114" y="1334" fill="#ffffff" font-size="40" font-family="Arial, sans-serif">Psalm 23:1</text>
